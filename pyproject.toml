[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lookahead-free"
version = "0.1.0"
description = "Verifiable look-ahead-freedom checks for the value-independent fragment of data pipelines: decision availability, window boundaries, PIT reads, joins and monotonicity, with explicit heuristic boundaries."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["lookahead", "point-in-time", "leakage", "backtest", "verification", "pipeline", "quant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
lf = "lookahead_free.cli:main"
lookahead-free = "lookahead_free.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
